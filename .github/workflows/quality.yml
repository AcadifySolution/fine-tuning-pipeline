name: Fine-Tuning Pipeline Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff black pytest pyyaml
      - name: Compile Python
        run: python -m compileall -q data src tests
      - name: Ruff
        run: ruff check data src tests
      - name: Black
        run: black --check data src tests
      - name: Validate config files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          json.loads(Path("configs/deepspeed_zero3.json").read_text())
          yaml.safe_load(Path("configs/lora_config.yaml").read_text())
          print("configuration valid")
          PY
      - name: Unit tests
        run: pytest -q

  terraform-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format
        run: terraform fmt -check -recursive terraform
      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

  codeql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@v3
