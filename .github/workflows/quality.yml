name: Fine-Tuning Pipeline Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight tooling
        run: python -m pip install --upgrade pip ruff black pytest pyyaml
      - name: Compile Python
        run: python -m compileall -q data src
      - name: Ruff
        run: ruff check data src
      - name: Black
        run: black --check data src
      - name: Validate JSON/YAML configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          json.loads(Path("configs/deepspeed_zero3.json").read_text())
          yaml.safe_load(Path("configs/lora_config.yaml").read_text())
          print("configuration files valid")
          PY
      - name: Import smoke test
        run: python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from data.dataset import SFTDataset
          from data.preprocess import convert_to_messages_format
          from src.model import prepare_model_for_lora
          print("imports OK")
          PY
      - name: Unit tests
        run: pytest -q
        continue-on-error: true

  terraform-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform
      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3
